# Déploiement continu sur Cloud Run, SANS clé stockée chez GitHub.
# GitHub présente un jeton OIDC signé ; Google l'échange (Workload Identity Federation) contre un accès temporaire au compte
# github-deployer, accordé seulement à CE dépôt (identifiant numérique) et à la branche main. Voir docs/DEPLOIEMENT.md.
#
# Étapes : détection des changements → évaluation des agents avec modèle juge (si un agent, un jeu de test ou le cœur
# de la plateforme a changé) → tests, image, déploiement, test de santé. Un agent sous son seuil bloque la mise en production.
name: Deploy

on:
  push:
    branches: [main]
    paths: ["src/Eap.Core/**", "src/Eap.Api/**", "src/Eap.Evals/**", "agents/**", "evals/**", "Dockerfile", ".dockerignore",
            ".github/workflows/deploy.yml", ".github/workflows/evaluate.yml"]
  workflow_dispatch:

# Un seul déploiement à la fois ; un déploiement en cours n'est jamais interrompu.
concurrency:
  group: deploy-eap-api
  cancel-in-progress: false

# Actions épinglées sur un commit exact (une étiquette comme v2 peut être déplacée) : ce job détient les droits de déploiement.
permissions:
  contents: read
  id-token: write   # nécessaire pour obtenir le jeton OIDC

env:
  PROJECT_ID: eap-portfolio
  REGION: europe-west9
  SERVICE: eap-api
  # Valeurs publiques (pas des secrets) : sans le jeton OIDC de ce dépôt, elles ne donnent aucun accès.
  WIF_PROVIDER: projects/920819552333/locations/global/workloadIdentityPools/github/providers/github-oidc
  DEPLOYER: github-deployer@eap-portfolio.iam.gserviceaccount.com
  IMAGE: europe-west9-docker.pkg.dev/eap-portfolio/cloud-run-source-deploy/eap-api

jobs:
  # Une campagne avec juge coûte ~0,35 $ : on ne la lance que si le comportement d'un agent peut avoir changé.
  changes:
    runs-on: ubuntu-latest
    outputs:
      agents: ${{ steps.diff.outputs.agents }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: diff
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Lancement manuel, nouvelle branche ou historique réécrit : on évalue (dans le doute, on mesure).
          if [ "${GITHUB_EVENT_NAME}" != "push" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "agents=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git diff --name-only "${BEFORE}" "${GITHUB_SHA}" | tee changed.txt
          if grep -qE '^(agents|evals|src/Eap\.Core|src/Eap\.Evals)/|^\.github/workflows/evaluate\.yml$' changed.txt; then
            echo "agents=true" >> "$GITHUB_OUTPUT"
          else
            echo "agents=false" >> "$GITHUB_OUTPUT"
          fi

  evaluate:
    needs: changes
    if: needs.changes.outputs.agents == 'true'
    uses: ./.github/workflows/evaluate.yml

  deploy:
    needs: [changes, evaluate]
    # Évaluation réussie, ou inutile (aucun agent modifié) ; jamais après un échec ou une annulation.
    if: ${{ !cancelled() && needs.changes.result == 'success' && (needs.evaluate.result == 'success' || needs.evaluate.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Les tests passent avant toute chose : on ne déploie jamais un code qui casse un test.
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - run: dotnet test -c Release

      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
      - uses: google-github-actions/setup-gcloud@e427ad8a34f8676edf47cf7d7925499adf3eb74f # v2.2.1

      # Image étiquetée par le commit : chaque révision Cloud Run se rattache à une version exacte du code et des fiches agents.
      - name: Construire et pousser l'image
        run: |
          gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet
          docker build -t "${IMAGE}:${GITHUB_SHA}" .
          docker push "${IMAGE}:${GITHUB_SHA}"

      # Seule l'image change, plus la configuration non secrète (audience IAP, registre Firestore, Cloud Trace) :
      # compte de service, secrets, IAP, administrateurs, accès privé et plafond d'instances sont conservés.
      - name: Déployer
        run: |
          gcloud run deploy "${SERVICE}" --image "${IMAGE}:${GITHUB_SHA}" --region "${REGION}" --project "${PROJECT_ID}" \
            --update-env-vars "Auth__IapAudience=/projects/920819552333/locations/${REGION}/services/${SERVICE},Gcp__ProjectId=${PROJECT_ID},FinOps__Ledger=Firestore,FinOps__FirestoreDatabase=eap-finops,Observability__CloudTrace=true" \
            --labels "commit=${GITHUB_SHA::12}" --quiet

      # Jeton d'accès (openid + email) : IAP l'accepte pour un compte de service autorisé (iap.httpsResourceAccessor).
      - id: iaptoken
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER }}
          token_format: access_token
          access_token_scopes: openid, https://www.googleapis.com/auth/userinfo.email

      # Contrôle après déploiement, sans appel de modèle (aucun coût) :
      # 1. le service répond et charge ses 2 agents ;
      # 2. /me renvoie l'identité du déployeur : IAP a signé un jeton ET l'application l'a vérifié, de bout en bout ;
      # 3. sans identifiants, l'accès est refusé (redirection vers la connexion Google ou 401/403).
      - name: Test de santé
        env:
          TOKEN: ${{ steps.iaptoken.outputs.access_token }}
          URL: https://eap-api-920819552333.europe-west9.run.app
        run: |
          body=$(curl -sf -H "Authorization: Bearer ${TOKEN}" "${URL}/health")
          echo "$body"; echo "$body" | grep -q '"agents":2'
          me=$(curl -sf -H "Authorization: Bearer ${TOKEN}" "${URL}/me")
          # une vérification par ligne : sous « bash -e », un échec au milieu d'une chaîne && n'arrêterait pas l'étape
          echo "$me" | grep -q '"authMode":"Iap"'
          echo "$me" | grep -q 'github-deployer@'
          echo "Identité IAP vérifiée par l'application"
          code=$(curl -s -o /dev/null -w '%{http_code}' "${URL}/agents")
          echo "Sans identifiants : HTTP $code"
          case "$code" in 302|401|403) ;; *) echo "L'accès devrait être refusé"; exit 1 ;; esac
