# Fiche agent — alimente le registre des agents (cf. governance/)
id: sav-produit
name: Assistant SAV produit
version: 0.3.0          # 0.2.0 : recherche hybride ; 0.3.0 : garde-fou des sources
status: pilot              # idea | design | pilot | production | retired
purpose: >
  Répondre aux questions des clients de l'enseigne (fictive) Maison Kerlenn sur les produits,
  la livraison, les retours et la garantie, à partir de la documentation officielle uniquement.
  Escalader vers un conseiller humain dès que la réponse n'est pas dans la documentation.
owners:
  business: Direction Service Client
  tech: Équipe Solutions IA
risk:
  ai_act: limited          # interaction avec des personnes → obligation de transparence (art. 50)
  personal_data: false     # l'agent ne demande ni ne stocke de données personnelles
  notes: >
    L'utilisateur est informé qu'il échange avec une IA. Pas de décision automatisée.
    Aucune donnée de commande ou client n'est accessible dans cette version.
model:
  provider: gemini
  name: gemini-3.5-flash-lite   # version figée (pas d'alias "latest") : traçabilité et évaluation reproductibles
  temperature: 0.2
  max_output_tokens: 1500   # inclut le raisonnement interne des modèles qui "réfléchissent" (Claude) : 600 tronquait
prompt_file: system.md
knowledge_dir: knowledge
retrieval:
  # Mesuré le 2026-11-08 (evals --retrieval-only), sections attendues retrouvées : mots-clés 13/16, sémantique 15/16,
  # hybride 16/16 (la question à deux sujets, mul-01, n'est couverte qu'en hybride).
  mode: hybrid             # keyword | semantic | hybrid
  embedding_provider: gemini
  embedding_model: gemini-embedding-2
  dimensions: 768
  top: 3
  min_similarity: 0.50     # questions documentées >= 0,55 ; « recette de crêpes » 0,48, « je parle à un humain ? » 0,47
guardrails:
  verify_sources: true     # toute source citée absente de la base est remplacée (Gemini en inventait 1 fois sur 5)
budget:
  daily_usd: 2.0
  max_requests_per_user_per_day: 30
evaluation:
  dataset: ../../evals/sav-produit.jsonl
  min_score: 0.85
