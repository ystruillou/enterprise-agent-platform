# Fiche agent — alimente le registre des agents (cf. governance/)
id: conformite-promo
name: Relecteur conformité promotionnelle
version: 0.3.0          # 0.2.0 : toutes les règles à chaque relecture ; 0.3.0 : règles de relecture, garde-fou réactivé
status: design
purpose: >
  Aider l'équipe marketing à relire un texte promotionnel avant publication : signaler les
  mentions obligatoires manquantes et les allégations à risque, et proposer une reformulation.
  L'agent conseille ; la validation finale reste humaine (juriste ou responsable marketing).
owners:
  business: Direction Marketing
  tech: Équipe Solutions IA
risk:
  ai_act: minimal          # outil interne d'aide à la rédaction, pas de décision sur des personnes
  personal_data: false
  notes: >
    Usage interne uniquement. Ne remplace pas l'avis du service juridique.
model:
  provider: anthropic
  name: claude-haiku-5-5
  temperature: 0.1
  max_output_tokens: 3000  # 900 tronquait 54 réponses sur 60 (raisonnement interne + reformulation complète), mesuré le 2026-11-08
prompt_file: system.md
knowledge_dir: knowledge
retrieval:
  # Mesuré le 2026-11-08 (evals --retrieval-only) : les mots-clés ne transmettent les bonnes règles que pour 10 textes sur 16
  # (« -30 % sur les canapés » ne partage aucun mot avec « Annonce de réduction de prix »), et un top 3 ne peut pas couvrir
  # un texte qui enfreint 4 règles. Un relecteur doit appliquer TOUTES les règles : la base est courte, on l'envoie en entier.
  mode: all
guardrails:
  # Réactivé en 0.3.0. Désactivé en 0.2.0 : le garde-fou ne connaissait que le format SAV (une ligne « Source : » finale)
  # et remplaçait une citation exacte suivie de son explication. Il vérifie maintenant chaque citation, la référence seule,
  # et ne remplace que la référence invérifiable, en conservant l'argument.
  verify_sources: true
budget:
  daily_usd: 1.0
  max_requests_per_user_per_day: 40
evaluation:
  dataset: ../../evals/conformite-promo.jsonl
  min_score: 0.8
  # pas de max_sentences : la réponse (problèmes + reformulation) a un format structuré, pas une limite de phrases
